[project]
name = "pulse-processor"
version = "0.1.0"
description = "Pulse: Kafka consumer that matches, enriches and indexes articles into ElasticSearch"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11",
    "elasticsearch[async]>=8.17,<9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processor"]

[tool.ruff]
target-version = "py312"
line-length = 100
